<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card</title>

    <!-- Modern Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Linked Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Background Images -->
    <div id="background-container"></div>
    <div id="overlay"></div>

    <!-- Main Content -->
    <div class="app-container">
        <!-- Hero Header -->
        <div class="hero-header" id="hero-header">
            <div class="logo-container">
                <img id="profile-logo" src="" alt="Profile Logo">
            </div>
            <div class="profile-info">
                <h1 id="profile-name"></h1>
                <div class="divider" id="header-divider"></div>
                <p id="profile-title"></p>
            </div>
            <div class="scroll-indicator" id="scroll-indicator">
                <span>Scroll Down</span>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>

        <!-- Contact Section -->
        <div class="contact-section" id="contact-section">


            <!-- Social Icons Row -->
            <div class="socials-row" id="socials-row">
                <!-- Dynamic Socials -->
            </div>

            <!-- Action Grid (Call, Email, Location) -->
            <div class="actions-grid" id="actions-grid">
                <!-- Dynamic Actions -->
            </div>

            <!-- Primary Actions (WhatsApp, Save Contact) -->
            <div class="primary-actions">
                <a href="#" class="whatsapp-btn" id="whatsapp-btn" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp"></i> WhatsApp Us
                </a>
                <a href="#" class="btn-primary" id="save-contact-btn">
                    <i class="fas fa-user-plus"></i> Save Contact
                </a>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>Powered by <a href="https://tappo.tappoo.workers.dev/" target="_blank"
                        rel="noopener noreferrer">TAPPO</a></p>
            </div>
        </div>
    </div>

    <!-- Linked JavaScript -->
    <script src="script.js"></script>
</body>

</html>
